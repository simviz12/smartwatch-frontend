name: Build APKs & Release

# Builds the phone, watch and watch-face APKs.
# - Every push to main: APKs are attached to the run as downloadable artifacts.
# - Every tag v*: a GitHub Release is published with the three APKs.
on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :core:test :mobile:testDebugUnitTest :wear:testDebugUnitTest --stacktrace

      - name: Assemble APKs
        # Optional: add a GEMINI_API_KEY repository secret to enable the AI assistant in the phone APK.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew :mobile:assembleDebug :wear:assembleDebug :watchface:assembleDebug --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp mobile/build/outputs/apk/debug/mobile-debug.apk dist/pulso-celular.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk dist/pulso-reloj.apk
          cp watchface/build/outputs/apk/debug/watchface-debug.apk dist/pulso-esfera-reloj.apk
          ls -la dist

      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulso-apks
          path: dist/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Pulso ${{ github.ref_name }}
          files: dist/*.apk
          body: |
            Rediseño "Marea" para celular y Wear OS.

            **Instalación**
            - `pulso-celular.apk` → teléfono Android 8+.
            - `pulso-reloj.apk` → reloj Wear OS 3+ (app, Tile y complicaciones).
            - `pulso-esfera-reloj.apk` → esfera de Pulso (Watch Face Format, Wear OS 4+). Instálala junto con la app del reloj.

            APKs de depuración (firmados con la clave de debug), para pruebas.
